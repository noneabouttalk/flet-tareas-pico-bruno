name: Compilar app (apk, Linux y Windows)

on:
  push:                     # cada vez que hago push
  workflow_dispatch:        # o a mano desde la pestaña Actions

env:
  UV_PYTHON: "3.12"
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  apk:
    runs-on: ubuntu-latest  # servidor Linux x86_64 (sí hay Android SDK)
    steps:
      - uses: actions/checkout@v6             # descarga mi código
      - uses: astral-sh/setup-uv@v6           # instala uv (Python + dependencias)
      - uses: actions/setup-java@v5           # JDK 17 para Android
        with:
          distribution: temurin
          java-version: "17"
      - name: Compilar apk
        run: uv run flet build apk --yes --verbose
      - uses: actions/upload-artifact@v4      # guarda el resultado para descargarlo
        with:
          name: mis-tareas-apk
          path: build/apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Librerías de sistema para Linux (GTK, compiladores...)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config \
            llvm lld binutils libgtk-3-dev libsecret-1-dev
      - name: Compilar Linux
        run: uv run flet build linux --yes --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: mis-tareas-linux
          path: build/linux

  windows:
    runs-on: windows-latest  # servidor Windows
    env:
      PYTHONUTF8: "1"               # Python escribe en UTF-8 (evita el error del símbolo √)
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Compilar Windows
        run: uv run flet build windows --yes --verbose --no-rich-output
      - uses: actions/upload-artifact@v4
        with:
          name: mis-tareas-windows
          path: build/windows
